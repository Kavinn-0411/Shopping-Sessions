[package]
name = "sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
memchr = "2"
libc = "0.2"
rayon = "1.10"
rustc-hash = "2"
mimalloc = { version = "=0.1.52", default-features = false, optional = true }

[features]
default = ["mi"]
mi = ["dep:mimalloc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
